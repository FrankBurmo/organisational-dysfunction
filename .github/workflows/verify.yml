name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Syntax-check loop scripts
        run: |
          for f in loop/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Validate skill and eval assets
        run: node loop/validate.js
